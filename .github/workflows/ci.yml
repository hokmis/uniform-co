name: CI

on:
  push:
    branches: ["main", "master", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test scripts/database/generate-production-read-model-sql.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
